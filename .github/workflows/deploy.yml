name: Collect and deploy

on:
  schedule:
    - cron: '7 22 * * *'   # 매일 22:07 UTC = 한국시간 07:07 (GitHub 사정으로 수 분~수십 분 늦을 수 있음)
  workflow_dispatch:   # GitHub 웹에서 "Run workflow" (수동 수집 + 배포)
  push:
    branches: [main]   # 코드 변경 시 빌드·배포만 (수집 없음)

# GITHUB_TOKEN 커밋은 다른 워크플로를 트리거하지 않으므로 수집→커밋→빌드→배포를 한 워크플로에서 처리한다.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Collect news (일부 피드 실패해도 계속)
        if: github.event_name != 'push'
        run: |
          python -m pip install -r collector/requirements.txt
          for t in collector/test_*.py; do (cd collector && python "$(basename $t)"); done
          python collector/collect.py

      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          # data/ 에 변경이 있으면 커밋(새 기사가 없어도 status.json 의 수집 시각·연속 실패 횟수는 매번 바뀜).
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "data: 뉴스 수집 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
